  <style>
:root {
  --bg: #f4ede2;
  --surface: #fffaf3;
  --surface-2: #efe5d6;
  --text: #3a2e24;
  --muted: #8a7764;
  --line: #e5d8c5;
  --accent: #a0714a;
  --accent-ink: #ffffff;
  --accent-soft: #f0e0cc;
  --danger: #a8483c;
  --danger-soft: #f6e1db;
  --ok: #5b7a46;
  --ok-soft: #e5ecd9;
  --warn: #a2681a;
  --warn-soft: #f8e9cf;
  --grey-soft: #ebe2d5;
  --radius: 14px;
  --shadow: 0 1px 2px rgba(90,62,35,.06), 0 6px 20px rgba(90,62,35,.07);
  --font: "Segoe UI", system-ui, -apple-system, Roboto, "Helvetica Neue", Arial, sans-serif;
  --serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, "Times New Roman", serif;
  color-scheme: light;
}
:root[data-theme="dark"] {
  --bg: #1d1813;
  --surface: #26201a;
  --surface-2: #312920;
  --text: #f2e9dd;
  --muted: #b4a490;
  --line: #3f352a;
  --accent: #d6a676;
  --accent-ink: #2a1c0f;
  --accent-soft: #48372a;
  --danger: #e98b7f;
  --danger-soft: #45231e;
  --ok: #a7c48d;
  --ok-soft: #2c3522;
  --warn: #e7b56a;
  --warn-soft: #3e2f17;
  --grey-soft: #342c24;
  --shadow: 0 1px 2px rgba(0,0,0,.4);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
  font-size: 15px;
  line-height: 1.45;
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
}
[hidden] { display: none !important; }
svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
a { color: var(--accent); }
code { background: var(--surface-2); padding: 1px 5px; border-radius: 4px; font-size: .9em; }
.muted { color: var(--muted); }
h1 { font-family: var(--serif); font-size: 30px; font-weight: 600; margin: 0; letter-spacing: -.01em; }
h2 { font-size: 18px; margin: 0; }
h3 { font-size: 14px; margin: 0 0 8px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; }

/* ---------- Brand ---------- */
.brand { display: flex; align-items: center; gap: 10px; font-weight: 600; font-family: var(--serif); font-size: 18px; }
.brand-mark {
  width: 32px; height: 32px; border-radius: 9px; background: var(--accent); color: var(--accent-ink);
  display: grid; place-items: center; font-size: 22px; font-weight: 700; line-height: 1;
}
.brand-lg .brand-mark { width: 44px; height: 44px; font-size: 30px; border-radius: 12px; }
.brand-lg .brand-name { font-size: 22px; }

/* ---------- Buttons & forms ---------- */
.btn {
  appearance: none; border: 1px solid var(--line); background: var(--surface); color: var(--text);
  font: inherit; font-weight: 550; padding: 9px 14px; border-radius: 10px; cursor: pointer;
  display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 40px;
  text-decoration: none; white-space: nowrap;
}
.btn:hover { background: var(--surface-2); }
.btn:disabled { opacity: .55; cursor: default; }
.btn-primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn-primary:hover { background: var(--accent); filter: brightness(1.08); }
.btn-danger { color: var(--danger); border-color: var(--danger-soft); background: var(--danger-soft); }
.btn-ghost { background: transparent; border-color: transparent; }
.btn-sm { min-height: 32px; padding: 5px 10px; font-size: 14px; }
.btn-block { width: 100%; }
.icon-btn { appearance: none; border: 0; background: transparent; color: var(--muted); font-size: 18px; width: 36px; height: 36px; border-radius: 8px; cursor: pointer; display: grid; place-items: center; }
.theme-toggle { border: 1px solid var(--line); background: var(--surface); color: var(--text); width: 40px; height: 40px; border-radius: 10px; }
.theme-toggle .sun { display: none; }
:root[data-theme="dark"] .theme-toggle .sun { display: block; }
:root[data-theme="dark"] .theme-toggle .moon { display: none; }
.auth-card { position: relative; }
.auth-card .theme-toggle { position: absolute; top: 16px; right: 16px; }
.icon-btn:hover { background: var(--surface-2); color: var(--text); }
.link { appearance: none; background: none; border: 0; color: var(--accent); font: inherit; cursor: pointer; padding: 4px 0; }

.form { display: grid; gap: 14px; }
.form label { display: grid; gap: 5px; font-size: 13px; font-weight: 600; color: var(--muted); }
.form input, .form select, .form textarea, .search {
  font: inherit; font-size: 16px; color: var(--text); background: var(--surface);
  border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; width: 100%; min-height: 44px;
}
.form textarea { min-height: 84px; resize: vertical; }
.form input:focus, .form select:focus, .form textarea:focus, .search:focus {
  outline: 2px solid var(--accent); outline-offset: -1px; border-color: transparent;
}
.form .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.form .check { display: flex; align-items: center; gap: 8px; color: var(--text); font-weight: 500; font-size: 15px; }
.form .check input { width: 20px; height: 20px; min-height: 0; accent-color: var(--accent); }
.msg { margin: 0; font-size: 14px; color: var(--danger); min-height: 1em; }
.msg.ok { color: var(--ok); }

/* ---------- Auth ---------- */
.auth { background: radial-gradient(circle at 20% 10%, var(--accent-soft), transparent 55%), var(--bg); min-height: 100dvh; display: grid; place-items: center; padding: 20px; }
.auth-card { width: 100%; max-width: 380px; background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 28px; box-shadow: var(--shadow); }
.auth-card > .muted { margin: 12px 0 20px; }
.auth-links { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 8px; margin-top: 14px; font-size: 14px; }

/* ---------- Shell ---------- */
.shell { display: grid; grid-template-columns: 240px 1fr; min-height: 100dvh; }
.sidebar {
  position: sticky; top: 0; height: 100dvh; padding: 20px 14px; background: var(--surface);
  border-right: 1px solid var(--line); display: flex; flex-direction: column; gap: 24px;
}
.sidebar .brand { padding: 0 8px; }
.nav { display: grid; gap: 4px; }
.nav a {
  display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 10px;
  color: var(--muted); text-decoration: none; font-weight: 550;
}
.nav a:hover { background: var(--surface-2); color: var(--text); }
.nav a.active { background: var(--accent-soft); color: var(--accent); }
.sidebar-foot { margin-top: auto; display: grid; gap: 8px; padding: 0 8px; }
.user { font-size: 13px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.main { min-width: 0; padding: 28px 32px 100px; max-width: 1100px; width: 100%; }
.demo-banner { background: var(--warn-soft); color: var(--warn); border-radius: 10px; padding: 10px 14px; font-size: 14px; margin-bottom: 18px; }

.page-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 18px; }
.page-head .actions { display: flex; gap: 8px; flex-wrap: wrap; }

/* ---------- Day nav ---------- */
.daybar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
.daybar .date-label { font-weight: 650; font-size: 17px; min-width: 0; flex: 1; }
.daybar input[type=date] { font: inherit; padding: 7px 10px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); color: var(--text); min-height: 40px; }
.daynav { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.seg { display: inline-flex; background: var(--surface-2); border-radius: 10px; padding: 3px; gap: 2px; }
.seg button { appearance: none; border: 0; background: transparent; font: inherit; font-size: 14px; font-weight: 550; color: var(--muted); padding: 6px 12px; border-radius: 8px; cursor: pointer; }
.seg button.on { background: var(--surface); color: var(--text); box-shadow: var(--shadow); }

.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 18px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; }
.stat b { display: block; font-family: var(--serif); font-size: 24px; font-weight: 600; font-variant-numeric: tabular-nums; }
.stat span { font-size: 13px; color: var(--muted); }

/* ---------- Lists ---------- */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
.list { list-style: none; margin: 0; padding: 0; }
.list > li + li { border-top: 1px solid var(--line); }
.item {
  display: grid; grid-template-columns: 70px 1fr auto; gap: 14px; align-items: center;
  padding: 12px 16px; cursor: pointer; width: 100%; text-align: left; background: none; border: 0; font: inherit; color: inherit;
}
.item:hover { background: var(--surface-2); }
.item .time { font-variant-numeric: tabular-nums; font-weight: 650; }
.item .time small { display: block; font-weight: 400; color: var(--muted); font-size: 12px; }
.item .who { min-width: 0; }
.item .who b { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.item .who span { font-size: 13px; color: var(--muted); display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.item.patient { grid-template-columns: 40px 1fr auto; }
.item.dated { grid-template-columns: 96px 1fr auto; }
.avatar { width: 40px; height: 40px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; font-weight: 650; font-size: 14px; }
.group-head { padding: 10px 16px; background: var(--surface-2); font-size: 13px; font-weight: 650; color: var(--muted); }

.badge { display: inline-block; font-size: 12px; font-weight: 600; padding: 3px 9px; border-radius: 99px; white-space: nowrap; }
.b-zaplanowana { background: var(--accent-soft); color: var(--accent); }
.b-odbyta { background: var(--ok-soft); color: var(--ok); }
.b-odwolana { background: var(--grey-soft); color: var(--muted); }
.b-nieobecnosc { background: var(--danger-soft); color: var(--danger); }
.b-nieoplacona { background: var(--warn-soft); color: var(--warn); }

.empty { padding: 40px 20px; text-align: center; color: var(--muted); }
.empty .btn { margin-top: 12px; }
.loading { padding: 40px; text-align: center; color: var(--muted); }

.toolbar { display: flex; gap: 10px; margin-bottom: 14px; }
.search { max-width: 420px; }

/* ---------- Patient detail ---------- */
.back { display: inline-flex; align-items: center; gap: 4px; text-decoration: none; color: var(--muted); font-size: 14px; margin-bottom: 12px; }
.detail { display: grid; grid-template-columns: 320px 1fr; gap: 18px; align-items: start; }
.info { padding: 18px; display: grid; gap: 12px; }
.info dl { margin: 0; display: grid; gap: 10px; }
.info dt { font-size: 12px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .05em; }
.info dd { margin: 2px 0 0; word-break: break-word; white-space: pre-wrap; }
.visit-notes { font-size: 14px; color: var(--muted); margin-top: 4px; white-space: pre-wrap; }

/* ---------- Report ---------- */
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th, td { text-align: left; padding: 10px 14px; border-bottom: 1px solid var(--line); white-space: nowrap; }
th { font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); background: var(--surface-2); }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }


/* ---------- Fizjoterapeuci / płatnik ---------- */
.item[style*="--fz"] { box-shadow: inset 4px 0 0 var(--fz); }
.item .who .fz, .fz { display: inline-flex; vertical-align: middle; align-items: center; gap: 5px; }
.fz i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex: none; }
.b-ubezp { background: #e3ebf3; color: #3d5f80; }
:root[data-theme="dark"] .b-ubezp { background: #22303d; color: #9cc0e2; }
.meta { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
.item.plain { grid-template-columns: 1fr auto; }
.select-sm { font: inherit; font-size: 14px; padding: 7px 10px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); color: var(--text); min-height: 40px; max-width: 100%; }
.daybar input[type=month] { font: inherit; padding: 7px 10px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); color: var(--text); min-height: 40px; }

/* ---------- Ustawienia ---------- */
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin-bottom: 18px; overflow-x: auto; scrollbar-width: none; }
.tabs a { padding: 10px 14px; text-decoration: none; color: var(--muted); font-weight: 550; border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; }
.tabs a.on { color: var(--accent); border-bottom-color: var(--accent); }
.swatches { border: 0; padding: 0; margin: 0; display: flex; gap: 10px; flex-wrap: wrap; }
.swatches legend { font-size: 13px; font-weight: 600; color: var(--muted); margin-bottom: 6px; padding: 0; }
.swatches label { display: block; cursor: pointer; }
.swatches input { position: absolute; opacity: 0; pointer-events: none; }
.swatches span { display: block; width: 34px; height: 34px; border-radius: 50%; border: 3px solid var(--surface); box-shadow: 0 0 0 1px var(--line); }
.swatches input:checked + span { box-shadow: 0 0 0 2px var(--text); }
.swatches input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }

/* ---------- Formularz wizyty ---------- */
.field { display: grid; gap: 5px; }
.field-label { font-size: 13px; font-weight: 600; color: var(--muted); }
.hint-link { font-weight: 500; font-size: 12px; }
.seg-full { display: grid; grid-template-columns: 1fr 1fr; width: 100%; }
.seg-full label { position: relative; display: block; cursor: pointer; color: var(--text); font-size: 15px; }
.seg-full input { position: absolute; opacity: 0; pointer-events: none; }
.seg-full span { display: block; text-align: center; padding: 9px 12px; border-radius: 8px; font-weight: 550; color: var(--muted); }
.seg-full input:checked + span { background: var(--surface); color: var(--accent); box-shadow: var(--shadow); }
.seg-full input:focus-visible + span { outline: 2px solid var(--accent); }

.combo { position: relative; }
.combo-selected { display: grid; grid-template-columns: 40px 1fr auto; gap: 12px; align-items: center; padding: 8px 10px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface-2); }
.combo-selected .who { min-width: 0; }
.combo-selected .who b { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.combo-selected .who span { font-size: 13px; color: var(--muted); }
.combo-search { position: relative; }
.combo-row { display: flex; gap: 8px; }
.combo-row input { flex: 1; min-width: 0; }
.combo-row .btn { min-height: 44px; }
.payer-note { font-weight: 500; color: var(--ok); }
.combo-list {
  list-style: none; margin: 6px 0 0; padding: 4px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface);
  box-shadow: var(--shadow); max-height: 300px; overflow-y: auto;
}
.combo-list li { display: grid; grid-template-columns: 36px 1fr; gap: 10px; align-items: center; padding: 8px 10px; border-radius: 8px; cursor: pointer; }
.combo-list li .avatar { width: 36px; height: 36px; font-size: 13px; }
.combo-list li .who b { display: block; font-size: 15px; }
.combo-list li .who span { font-size: 13px; color: var(--muted); }
.combo-list li.hi, .combo-list li:hover { background: var(--surface-2); }
.combo-list li.none { display: block; color: var(--muted); cursor: default; font-size: 14px; }
.combo-list li.none:hover { background: none; }
.combo-list li.add { display: flex; gap: 10px; color: var(--accent); font-weight: 600; border-top: 1px solid var(--line); border-radius: 0 0 8px 8px; margin-top: 2px; }
.combo-list li.add span { width: 36px; text-align: center; font-size: 20px; line-height: 1; }
.newpat { border: 1px dashed var(--accent); border-radius: 12px; padding: 14px; display: grid; gap: 12px; background: var(--accent-soft); }
.newpat-head { display: flex; justify-content: space-between; align-items: center; }
.newpat .btn { justify-self: start; }
.dup-alert { background: var(--warn-soft); color: var(--text); border: 1px solid var(--warn); border-radius: 10px; padding: 12px 14px; display: grid; gap: 8px; font-size: 14px; }
.dup-alert > b { color: var(--warn); }
.dup-alert ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.dup-alert li { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.dup-alert .btn-ghost { justify-self: start; padding-left: 0; color: var(--muted); text-decoration: underline; }


/* ---------- Raport: filtr rodzajów, wynagrodzenia ---------- */
.multi { position: relative; }
.multi > summary { list-style: none; cursor: pointer; display: flex; align-items: center; gap: 8px; max-width: 280px; }
.multi > summary::-webkit-details-marker { display: none; }
.multi > summary span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.multi > summary::after { content: ""; width: 7px; height: 7px; border-right: 1.6px solid currentColor; border-bottom: 1.6px solid currentColor; transform: rotate(45deg) translateY(-2px); margin-left: auto; flex: none; }
.multi.on > summary { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); font-weight: 600; }
.multi-panel {
  position: absolute; z-index: 40; top: calc(100% + 6px); left: 0; width: 340px; max-width: calc(100vw - 32px);
  background: var(--surface); border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 12px 32px rgba(58,40,24,.16);
  padding: 10px; display: grid; gap: 8px;
}
.multi-search { font: inherit; font-size: 15px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--text); width: 100%; }
.multi-actions { display: flex; justify-content: space-between; font-size: 14px; }
.multi-list { max-height: 320px; overflow-y: auto; display: grid; gap: 6px; }
.multi-group { display: grid; gap: 1px; }
.multi-group-head { appearance: none; background: none; border: 0; text-align: left; font: inherit; font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); padding: 6px 6px 4px; cursor: pointer; }
.multi-group-head:hover { color: var(--accent); }
.multi-list label { display: flex; gap: 10px; align-items: flex-start; padding: 6px; border-radius: 6px; cursor: pointer; font-size: 14px; }
.multi-list label:hover { background: var(--surface-2); }
.multi-list input { width: 17px; height: 17px; margin: 1px 0 0; accent-color: var(--accent); flex: none; }
.multi-list small { color: var(--muted); }

table.report tbody tr { cursor: pointer; }
table.report tbody tr:hover td { background: var(--surface-2); }
tr.row-muted td { color: var(--muted); }

  <script type="module">
// =====================================================================

const cfg = window.APP_CONFIG || {};
const DEMO = !cfg.SUPABASE_URL || !cfg.SUPABASE_ANON_KEY;
const SUPABASE_CDN = "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];

const STATUSY = {
  zaplanowana: "Zaplanowana",
  odbyta: "Odbyta",
  odwolana: "Odwołana",
  nieobecnosc: "Nieobecność",
};
const KOLORY = ["#a0714a", "#5b7a46", "#4f7396", "#a8483c", "#8a6aa3", "#c28a2c", "#3f8a83", "#7a6a5a"];

const esc = (v) =>
  String(v ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const norm = (s) => String(s ?? "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/ł/g, "l").trim();

const pad = (n) => String(n).padStart(2, "0");
const startOfDay = (d) => { const x = new Date(d); x.setHours(0, 0, 0, 0); return x; };
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const startOfWeek = (d) => { const x = startOfDay(d); const wd = (x.getDay() + 6) % 7; return addDays(x, -wd); };
const sameDay = (a, b) => startOfDay(a).getTime() === startOfDay(b).getTime();
const toDateInput = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const toLocalInput = (d) => `${toDateInput(d)}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
const fromDateInput = (s) => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
const cap = (s) => s.charAt(0).toUpperCase() + s.slice(1);

const fmt = {
  time: (d) => new Date(d).toLocaleTimeString("pl-PL", { hour: "2-digit", minute: "2-digit" }),
  day: (d) => new Date(d).toLocaleDateString("pl-PL", { weekday: "long", day: "numeric", month: "long" }),
  date: (d) => new Date(d).toLocaleDateString("pl-PL", { day: "2-digit", month: "2-digit", year: "numeric" }),
  dateTime: (d) => new Date(d).toLocaleString("pl-PL", { day: "2-digit", month: "2-digit", year: "numeric", hour: "2-digit", minute: "2-digit" }),
  money: (n) => new Intl.NumberFormat("pl-PL", { style: "currency", currency: "PLN" }).format(Number(n) || 0),
};

const fullName = (p) => (p ? `${p.nazwisko} ${p.imie}` : "— pacjent usunięty —");
const personName = (p) => (p ? `${p.imie} ${p.nazwisko}` : "");

class SilentError extends Error {}

function polishError(err) {
  const m = err?.message || String(err);
  const map = {
    "Invalid login credentials": "Nieprawidłowy e-mail lub hasło.",
    "Email not confirmed": "Potwierdź adres e-mail (sprawdź skrzynkę).",
    "User already registered": "Konto z tym adresem już istnieje.",

    "pacjenci_pesel_uniq": "Pacjent z tym numerem PESEL już jest w bazie.",
  };
  for (const k in map) if (m.includes(k)) return map[k];
  if (m.includes("pesel")) return "PESEL musi mieć 11 cyfr.";
  return m;
}

// PESEL → data urodzenia
function peselToDate(pesel) {
  if (!/^\d{11}$/.test(pesel)) return null;
  let y = +pesel.slice(0, 2), m = +pesel.slice(2, 4);
  const d = +pesel.slice(4, 6);
  let c = 1900;
  if (m > 80) { c = 1800; m -= 80; } else if (m > 60) { c = 2200; m -= 60; }
  else if (m > 40) { c = 2100; m -= 40; } else if (m > 20) { c = 2000; m -= 20; }
  const date = new Date(c + y, m - 1, d);
  return date.getMonth() === m - 1 ? toDateInput(date) : null;
}

// Szukanie pacjentów po imieniu, nazwisku, PESEL, telefonie
function matchPatients(patients, query) {
  const q = norm(query);
  if (!q) return patients;
  const words = q.split(/\s+/);
  const digits = q.replace(/\s/g, "");
  return patients.filter((p) => {
    const hay = norm(`${p.imie} ${p.nazwisko} ${p.email || ""}`);
    if (/^\d+$/.test(digits) && ((p.pesel || "").includes(digits) || (p.telefon || "").replace(/\D/g, "").includes(digits))) return true;
    return words.every((w) => hay.includes(w));
  });
}

// Wykrywanie duplikatów pacjenta
function findDuplicates(patients, { imie, nazwisko, pesel }, excludeId) {
  const others = patients.filter((p) => p.id !== excludeId);
  const byPesel = pesel ? others.filter((p) => p.pesel === pesel) : [];
  const byName = others.filter((p) => !byPesel.includes(p) && norm(p.imie) === norm(imie) && norm(p.nazwisko) === norm(nazwisko));
  return { byPesel, byName, any: byPesel.length + byName.length > 0 };
}

const DICTS = {
  rodzaje: { table: "rodzaje_wizyt", order: "nazwa" },

const api = DEMO ? createDemoApi() : await createSupabaseApi();

async function createSupabaseApi() {
  const { createClient } = await import(SUPABASE_CDN);
  const sb = createClient(cfg.SUPABASE_URL, cfg.SUPABASE_ANON_KEY, {
    auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true },
  });
  const ok = ({ data, error }) => { if (error) throw error; return data; };
  const VISIT_SELECT = "*, pacjent:pacjenci(id, imie, nazwisko, telefon, pesel)";
  const clean = (row) => { const { user_id, created_at, updated_at, pacjent, ...r } = row; return r; };
  const upsert = async (table, row) => {
    const { id, ...r } = clean(row);
    return id
      ? ok(await sb.from(table).update(r).eq("id", id).select().single())
      : ok(await sb.from(table).insert(r).select().single());
  };

  return {
    async getUser() { const { data } = await sb.auth.getSession(); return data.session?.user || null; },
    onAuth(cb) { sb.auth.onAuthStateChange((event, session) => cb(event, session?.user || null)); },
    async signIn(email, password) { ok(await sb.auth.signInWithPassword({ email, password })); },
    async signUp(email, password) {
      const data = ok(await sb.auth.signUp({ email, password, options: { emailRedirectTo: location.origin + location.pathname } }));
      return !!data.session;
    },
    async resetPassword(email) { ok(await sb.auth.resetPasswordForEmail(email, { redirectTo: location.origin + location.pathname })); },
    async updatePassword(password) { ok(await sb.auth.updateUser({ password })); },
    async signOut() { await sb.auth.signOut(); },

    async listPatients() { return ok(await sb.from("pacjenci").select("*").order("nazwisko").order("imie")); },
    async getPatient(id) { return ok(await sb.from("pacjenci").select("*").eq("id", id).maybeSingle()); },
    savePatient: (p) => upsert("pacjenci", p),
    async deletePatient(id) { ok(await sb.from("pacjenci").delete().eq("id", id)); },

    async listVisits(from, to) {
      return ok(await sb.from("wizyty").select(VISIT_SELECT)
        .gte("data_wizyty", from.toISOString()).lt("data_wizyty", to.toISOString()).order("data_wizyty"));
    },
    async listPatientVisits(pid) {
      return ok(await sb.from("wizyty").select(VISIT_SELECT).eq("pacjent_id", pid).order("data_wizyty", { ascending: false }));
    },
    saveVisit: (v) => upsert("wizyty", v),
    async deleteVisit(id) { ok(await sb.from("wizyty").delete().eq("id", id)); },

    async listDict(key) { const d = DICTS[key]; return ok(await sb.from(d.table).select("*").order(d.order)); },
    saveDict: (key, row) => upsert(DICTS[key].table, row),
    async deleteDict(key, id) { ok(await sb.from(DICTS[key].table).delete().eq("id", id)); },
    async saveRates(rodzaj_id, rates) {
      ok(await sb.from("stawki_fizjo").delete().eq("rodzaj_id", rodzaj_id));
      if (rates.length) ok(await sb.from("stawki_fizjo").insert(rates.map((r) => ({ rodzaj_id, ...r }))));
    },
  };
}

function createDemoApi() {
  const K = { p: "rw5_pacjenci", v: "rw5_wizyty", rodzaje: "rw5_rodzaje", fizjo: "rw5_fizjo", ubezp: "rw5_ubezp", stawki: "rw5_stawki" };
  const load = (k) => { try { return JSON.parse(localStorage.getItem(k)) || []; } catch { return []; } };
  const save = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} };
  const uid = () => crypto.randomUUID?.() || Math.random().toString(36).slice(2) + Date.now().toString(36);
  const now = () => new Date().toISOString();
  const user = { email: "demo@lokalnie" };

  if (!localStorage.getItem(K.p)) seed();

  function seed() {
    const R = [
      ["Konsultacja fizjoterapeutyczna", 45, 200], ["Terapia manualna", 60, 220], ["Masaż leczniczy", 30, 120],
      ["Kinezyterapia", 45, 150], ["Fala uderzeniowa", 15, 100],
    ].map(([nazwa, czas_trwania, cena]) => ({ id: uid(), nazwa, czas_trwania, cena, kod: null, ubezpieczyciel_id: null, aktywny: true }));
    const F = [
      ["Anna", "Zielińska", KOLORY[0]], ["Tomasz", "Lis", KOLORY[1]], ["Ewa", "Mazur", KOLORY[2]],
    ].map(([imie, nazwisko, kolor]) => ({ id: uid(), imie, nazwisko, kolor, telefon: "", email: "", aktywny: true }));
    const U = ["PZU Zdrowie", "LUX MED", "Medicover", "Allianz"]
      .map((nazwa) => ({ id: uid(), nazwa, nip: "", telefon: "", email: "", uwagi: "", aktywny: true }));
    // cenniki ubezpieczycieli: [indeks zakładu, nazwa, kod, czas, cena]
    const RU = [
      [0, "Konsultacja fizjoterapeutyczna", "PZU-FZ01", 30, 90], [0, "Zabieg fizjoterapeutyczny – terapia indywidualna", "PZU-FZ02", 30, 70],
      [1, "Fizjoterapia – terapia indywidualna", "LM-1405", 45, 110], [1, "Masaż leczniczy częściowy", "LM-1410", 20, 60],
      [2, "Wizyta fizjoterapeutyczna", "MC-FIZ", 40, 100], [2, "Terapia manualna kręgosłupa", "MC-TMK", 30, 95],
      [3, "Rehabilitacja ruchowa", null, 30, 85],
    ].map(([ui, nazwa, kod, czas_trwania, cena]) => ({ id: uid(), nazwa, kod, czas_trwania, cena, ubezpieczyciel_id: U[ui].id, aktywny: true }));
    R.push(...RU);
    R.forEach((r) => (r.wynagrodzenie = r.cena != null ? Math.round(r.cena * 0.5) : null));
    // indywidualne stawki: Tomasz Lis dostaje więcej za terapię manualną, Ewa Mazur za falę uderzeniową
    const S = [
      { id: uid(), rodzaj_id: R[1].id, fizjoterapeuta_id: F[1].id, kwota: 130, created_at: now() },
      { id: uid(), rodzaj_id: R[4].id, fizjoterapeuta_id: F[2].id, kwota: 60, created_at: now() },
    ];
    const rate = (r, f) => S.find((s) => s.rodzaj_id === r.id && s.fizjoterapeuta_id === f.id)?.kwota ?? r.wynagrodzenie;
    const P = [
      ["Anna", "Kowalska", "85031512345", "600 100 200"],
      ["Jan", "Nowak", "72110354321", "601 222 333"],
      ["Maria", "Wiśniewska", "90062011223", "602 444 555"],
      ["Piotr", "Wójcik", "01250367890", "603 666 777"],
      ["Katarzyna", "Kamińska", "78091998765", "604 888 999"],
    ].map(([imie, nazwisko, pesel, telefon]) => ({
      id: uid(), imie, nazwisko, pesel, telefon, email: "", adres: "", notatki: "",
      data_urodzenia: peselToDate(pesel), created_at: now(), platnik: "prywatny", ubezpieczyciel_id: null, nr_polisy: null,
    }));
    Object.assign(P[1], { platnik: "ubezpieczenie", ubezpieczyciel_id: U[0].id, nr_polisy: "PZU-55120" });
    Object.assign(P[3], { platnik: "ubezpieczenie", ubezpieczyciel_id: U[1].id, nr_polisy: "LM-88213" });
    const t = startOfDay(new Date());
    const at = (dd, h, m) => { const d = addDays(t, dd); d.setHours(h, m); return d.toISOString(); };
    const V = [
      [0, 0, 8, 30, 1, 0, "odbyta", true, null],
      [1, 0, 9, 30, 0, 1, "odbyta", false, 0],
      [2, 0, 11, 0, 2, 0, "zaplanowana", false, null],
      [3, 0, 13, 0, 3, 2, "zaplanowana", false, 1],
      [4, 1, 10, 0, 0, 1, "zaplanowana", false, null],
      [0, 2, 9, 0, 1, 0, "zaplanowana", false, null],
      [2, -7, 12, 0, 4, 2, "odbyta", true, 2],
      [1, -3, 16, 0, 1, 1, "nieobecnosc", false, null],
    ].map(([pi, dd, h, m, ri, fi, status, oplacona, ui]) => {
      const r = ui == null ? R[ri] : R.find((x) => x.ubezpieczyciel_id === U[ui].id);
      return {
      id: uid(), pacjent_id: P[pi].id, data_wizyty: at(dd, h, m),
      rodzaj_id: r.id, rodzaj: r.nazwa, czas_trwania: r.czas_trwania,
      kwota: status === "nieobecnosc" ? null : r.cena, fizjoterapeuta_id: F[fi].id,
      wynagrodzenie: status === "nieobecnosc" ? null : rate(r, F[fi]),
      platnik: ui == null ? "prywatny" : "ubezpieczenie", ubezpieczyciel_id: ui == null ? null : U[ui].id,
      nr_autoryzacji: ui == null ? null : "AUT/" + (1000 + pi), status, oplacona, opis: "", zalecenia: "", created_at: now(),
    }; });
    save(K.p, P); save(K.v, V); save(K.rodzaje, R); save(K.fizjo, F); save(K.ubezp, U); save(K.stawki, S);
  }

  const withPatient = (v, P) => ({ ...v, pacjent: P.find((p) => p.id === v.pacjent_id) || null });
  const byDate = (a, b) => a.data_wizyty.localeCompare(b.data_wizyty);
  const upsert = (key, row) => {
    const { pacjent, ...r } = row;
    const all = load(key);
    if (r.id) { const i = all.findIndex((x) => x.id === r.id); all[i] = { ...all[i], ...r }; save(key, all); return all[i]; }
    const n = { ...r, id: uid(), created_at: now() }; all.push(n); save(key, all); return n;
  };

  return {
    async getUser() { return user; },
    onAuth() {},
    async signIn() {}, async signUp() { return true; }, async resetPassword() {}, async updatePassword() {},
    async signOut() {
      if (confirm("Tryb demo: wyczyścić dane przykładowe i zacząć od nowa?")) {
        Object.values(K).forEach((k) => localStorage.removeItem(k)); location.reload();
      }
    },
    async listPatients() {
      return load(K.p).sort((a, b) => (a.nazwisko + " " + a.imie).localeCompare(b.nazwisko + " " + b.imie, "pl"));
    },
    async getPatient(id) { return load(K.p).find((p) => p.id === id) || null; },
    async savePatient(p) {
      if (p.pesel && load(K.p).some((x) => x.pesel === p.pesel && x.id !== p.id)) throw new Error("pacjenci_pesel_uniq");
      return upsert(K.p, p);
    },
    async deletePatient(id) {
      save(K.p, load(K.p).filter((p) => p.id !== id));
      save(K.v, load(K.v).filter((v) => v.pacjent_id !== id));
    },
    async listVisits(from, to) {
      const P = load(K.p);
      return load(K.v).filter((v) => { const d = new Date(v.data_wizyty); return d >= from && d < to; })
        .sort(byDate).map((v) => withPatient(v, P));
    },
    async listPatientVisits(pid) {
      const P = load(K.p);
      return load(K.v).filter((v) => v.pacjent_id === pid).sort(byDate).reverse().map((v) => withPatient(v, P));
    },
    saveVisit: async (v) => upsert(K.v, v),
    async deleteVisit(id) { save(K.v, load(K.v).filter((v) => v.id !== id)); },

    async listDict(key) {
      const o = DICTS[key].order;
      return load(K[key]).sort((a, b) => String(a[o]).localeCompare(String(b[o]), "pl"));
    },
    saveDict: async (key, row) => upsert(K[key], row),
    async saveRates(rodzaj_id, rates) {
      save(K.stawki, [...load(K.stawki).filter((s) => s.rodzaj_id !== rodzaj_id),
        ...rates.map((r) => ({ id: uid(), rodzaj_id, ...r, created_at: now() }))]);
    },
    async deleteDict(key, id) {
      save(K[key], load(K[key]).filter((x) => x.id !== id));
      if (key === "ubezp") {
        const gone = load(K.rodzaje).filter((r) => r.ubezpieczyciel_id === id).map((r) => r.id);
        save(K.rodzaje, load(K.rodzaje).filter((r) => r.ubezpieczyciel_id !== id));
        save(K.v, load(K.v).map((v) => (gone.includes(v.rodzaj_id) ? { ...v, rodzaj_id: null } : v)));
        save(K.stawki, load(K.stawki).filter((s) => !gone.includes(s.rodzaj_id)));
      }
      if (key === "rodzaje") save(K.stawki, load(K.stawki).filter((s) => s.rodzaj_id !== id));
      if (key === "fizjo") save(K.stawki, load(K.stawki).filter((s) => s.fizjoterapeuta_id !== id));
      if (key === "stawki") return;
      const col = { rodzaje: "rodzaj_id", fizjo: "fizjoterapeuta_id", ubezp: "ubezpieczyciel_id" }[key];
      if (!col) return;
      save(K.v, load(K.v).map((v) => (v[col] === id ? { ...v, [col]: null } : v)));
    },
  };
}

const state = {
  user: null,
  day: startOfDay(new Date()),
  mode: "dzien", // dzien | tydzien | nadchodzace
  fizjo: "",     // filtr fizjoterapeuty ("" = wszyscy)
  search: "",
  month: toDateInput(new Date()).slice(0, 7),
  reportFizjo: "",
  reportTypes: [], // wybrane pozycje cennika (puste = wszystkie)
  reportPayer: "", // "" = wszyscy, "prywatny", "ubezpieczenie" (wszyscy ubezpieczyciele) albo id zakładu
  signUpMode: false,
  dict: { rodzaje: [], fizjo: [], ubezp: [], stawki: [] },
};

async function loadDicts() {
  const [rodzaje, fizjo, ubezp, stawki] = await Promise.all([
    api.listDict("rodzaje"), api.listDict("fizjo"), api.listDict("ubezp"),
    api.listDict("stawki").catch(() => []),
  ]);
  state.dict = { rodzaje, fizjo, ubezp, stawki };
}
const byId = (key, id) => state.dict[key].find((x) => x.id === id) || null;
const active = (key) => state.dict[key].filter((x) => x.aktywny !== false);
const priceList = (ubezpId) => state.dict.rodzaje.filter((r) => (r.ubezpieczyciel_id || null) === (ubezpId || null));
const rodzajLabel = (r) => `${r.nazwa} · ${r.czas_trwania} min${r.cena != null ? " · " + fmt.money(r.cena) : ""}`;
// Stawka fizjoterapeuty: indywidualna → domyślna pozycji cennika → brak
function rateFor(rodzaj_id, fizjo_id) {
  if (!rodzaj_id || !fizjo_id) return null;
  const s = state.dict.stawki.find((x) => x.rodzaj_id === rodzaj_id && x.fizjoterapeuta_id === fizjo_id);
  if (s) return +s.kwota;
  const r = byId("rodzaje", rodzaj_id);
  return r?.wynagrodzenie != null ? +r.wynagrodzenie : null;
}
// Kwota dla fizjoterapeuty za wizytę: zapisana przy wizycie albo wyliczona z cennika
const payout = (v) => (v.wynagrodzenie != null ? +v.wynagrodzenie : rateFor(v.rodzaj_id, v.fizjoterapeuta_id));
const fizjoName = (id) => { const f = byId("fizjo", id); return f ? personName(f) : ""; };
const payerName = (v) => v.platnik === "ubezpieczenie" ? (byId("ubezp", v.ubezpieczyciel_id)?.nazwa || "Ubezpieczenie") : "Prywatnie";

function route() {
  const [, name = "wizyty", id, sub] = location.hash.split("/");
  return { name, id, sub };
}

async function render() {
  if (!state.user) return;
  const { name, id, sub } = route();
  const navName = name === "pacjent" ? "pacjenci" : name;
  $$(".nav a").forEach((a) => a.classList.toggle("active", a.dataset.nav === navName));
  $("#fab").hidden = name === "raport" || name === "ustawienia";
  $("#fab").setAttribute("aria-label", name === "pacjenci" ? "Nowy pacjent" : "Nowa wizyta");
  const view = $("#view");
  try {
    if (name === "pacjenci") await viewPatients(view);
    else if (name === "pacjent") await viewPatient(view, id);
    else if (name === "raport") await viewReport(view);
    else if (name === "ustawienia") await viewSettings(view, id || "rodzaje", sub);
    else await viewVisits(view);
    addThemeButton(view);
  } catch (err) {
    console.error(err);
    view.innerHTML = `<div class="card empty">Nie udało się wczytać danych.<br><small>${esc(polishError(err))}</small><br><button class="btn" onclick="location.reload()">Spróbuj ponownie</button></div>`;
  }
}

function fizjoFilterSelect(id, value) {
  const list = state.dict.fizjo;
  if (!list.length) return "";
  return `<select class="select-sm" id="${id}" aria-label="Fizjoterapeuta">
    <option value="">Wszyscy fizjoterapeuci</option>
    ${list.map((f) => `<option value="${esc(f.id)}" ${f.id === value ? "selected" : ""}>${esc(personName(f))}${f.aktywny === false ? " (nieaktywny)" : ""}</option>`).join("")}
  </select>`;
}

function visitItem(v, { showDate = false } = {}) {
  const end = new Date(new Date(v.data_wizyty).getTime() + (v.czas_trwania || 0) * 60000);
  const unpaid = v.status === "odbyta" && v.kwota > 0 && !v.oplacona;
  const f = byId("fizjo", v.fizjoterapeuta_id);
  const fz = f ? `<span class="fz"><i style="background:${esc(f.kolor)}"></i>${esc(personName(f))}</span>` : "";
  const who = showDate
    ? `<b>${esc(v.rodzaj || "Wizyta")}${v.kwota != null ? " · " + esc(fmt.money(v.kwota)) : ""}</b><span>${fz}</span>` +
      (v.opis ? `<span class="visit-notes">${esc(v.opis.slice(0, 140))}${v.opis.length > 140 ? "…" : ""}</span>` : "")
    : `<b>${esc(fullName(v.pacjent))}</b><span>${esc(v.rodzaj || "Wizyta")}${fz ? " · " : ""}${fz}</span>`;
  return `<li><button class="item${showDate ? " dated" : ""}" data-visit="${esc(v.id)}" ${f ? `style="--fz:${esc(f.kolor)}"` : ""}>
    <div class="time">${showDate ? esc(fmt.date(v.data_wizyty)) + "<small>" + esc(fmt.time(v.data_wizyty)) + "</small>"
      : esc(fmt.time(v.data_wizyty)) + "<small>do " + esc(fmt.time(end)) + "</small>"}</div>
    <div class="who">${who}</div>
    <div class="meta">
      <span class="badge b-${esc(v.status)}">${esc(STATUSY[v.status] || v.status)}</span>
      ${v.platnik === "ubezpieczenie" ? `<span class="badge b-ubezp">${esc(payerName(v))}</span>` : ""}
      ${unpaid ? '<span class="badge b-nieoplacona">Nieopłacona</span>' : ""}
    </div>
  </button></li>`;
}

async function viewVisits(view) {
  let from, to, label;
  if (state.mode === "tydzien") {
    from = startOfWeek(state.day); to = addDays(from, 7);
    label = `${fmt.date(from)} – ${fmt.date(addDays(to, -1))}`;
  } else if (state.mode === "nadchodzace") {
    from = new Date(); to = addDays(startOfDay(new Date()), 60);
    label = "Najbliższe 60 dni";
  } else {
    from = state.day; to = addDays(from, 1);
    label = sameDay(from, new Date()) ? "Dziś, " + fmt.day(from) : cap(fmt.day(from));
  }

  view.innerHTML = `
    <div class="page-head"><h1>Wizyty</h1>
      <div class="actions"><button class="btn btn-primary hide-sm" id="add-visit">+ Nowa wizyta</button></div>
    </div>
    <div class="daybar">
      <div class="seg" role="tablist">
        <button data-mode="dzien" class="${state.mode === "dzien" ? "on" : ""}">Dzień</button>
        <button data-mode="tydzien" class="${state.mode === "tydzien" ? "on" : ""}">Tydzień</button>
        <button data-mode="nadchodzace" class="${state.mode === "nadchodzace" ? "on" : ""}">Nadchodzące</button>
      </div>
      ${state.mode !== "nadchodzace" ? `<div class="daynav">
      <button class="btn btn-sm" id="prev" aria-label="Wstecz">‹</button>
      <button class="btn btn-sm" id="today">Dziś</button>
      <button class="btn btn-sm" id="next" aria-label="Dalej">›</button>
      <input type="date" id="pick" value="${toDateInput(state.day)}" aria-label="Wybierz datę"></div>` : ""}
      ${fizjoFilterSelect("fizjo-filter", state.fizjo)}
    </div>
    <div class="daybar"><div class="date-label">${esc(label)}</div></div>
    <div id="stats"></div>
    <div class="card"><div class="loading">Wczytywanie…</div></div>`;

  $$("[data-mode]", view).forEach((b) => b.onclick = () => { state.mode = b.dataset.mode; render(); });
  const step = state.mode === "tydzien" ? 7 : 1;
  $("#prev", view)?.addEventListener("click", () => { state.day = addDays(state.day, -step); render(); });
  $("#next", view)?.addEventListener("click", () => { state.day = addDays(state.day, step); render(); });
  $("#today", view)?.addEventListener("click", () => { state.day = startOfDay(new Date()); render(); });
  $("#pick", view)?.addEventListener("change", (e) => { if (e.target.value) { state.day = fromDateInput(e.target.value); render(); } });
  $("#fizjo-filter", view)?.addEventListener("change", (e) => { state.fizjo = e.target.value; render(); });
  $("#add-visit", view).onclick = () => visitModal({ data_wizyty: defaultVisitDate() });

  let visits = await api.listVisits(from, to);
  if (state.fizjo) visits = visits.filter((v) => v.fizjoterapeuta_id === state.fizjo);
  const done = visits.filter((v) => v.status === "odbyta");
  $("#stats", view).innerHTML = `<div class="stats">
    <div class="stat"><b>${visits.length}</b><span>Wszystkie wizyty</span></div>
    <div class="stat"><b>${visits.filter((v) => v.status === "zaplanowana").length}</b><span>Zaplanowane</span></div>
    <div class="stat"><b>${done.length}</b><span>Odbyte</span></div>
    <div class="stat"><b>${fmt.money(done.reduce((s, v) => s + (+v.kwota || 0), 0))}</b><span>Przychód (odbyte)</span></div>
  </div>`;

  const card = $(".card", view);
  if (!visits.length) {
    card.innerHTML = `<div class="empty">Brak wizyt w tym okresie.<br><button class="btn btn-primary" id="empty-add">+ Dodaj wizytę</button></div>`;
    $("#empty-add", card).onclick = () => visitModal({ data_wizyty: defaultVisitDate() });
    return;
  }
  if (state.mode === "dzien") {
    card.innerHTML = `<ul class="list">${visits.map((v) => visitItem(v)).join("")}</ul>`;
  } else {
    const groups = new Map();
    visits.forEach((v) => {
      const k = toDateInput(new Date(v.data_wizyty));
      if (!groups.has(k)) groups.set(k, []);
      groups.get(k).push(v);
    });
    card.innerHTML = [...groups].map(([k, list]) =>
      `<div class="group-head">${esc(cap(fmt.day(fromDateInput(k))))}</div><ul class="list">${list.map((v) => visitItem(v)).join("")}</ul>`).join("");
  }
  bindVisitClicks(card, visits);
}

function bindVisitClicks(root, visits) {
  $$("[data-visit]", root).forEach((b) => b.onclick = () => visitModal(visits.find((v) => v.id === b.dataset.visit)));
}

function defaultVisitDate() {
  const d = new Date(state.day);
  const now = new Date();
  if (sameDay(d, now) && now.getHours() >= 7 && now.getHours() < 20) d.setHours(now.getHours() + 1, 0, 0, 0);
  else d.setHours(9, 0, 0, 0);
  return d.toISOString();
}

  $("#add-patient", view).onclick = () => patientModal({});

  const patients = await api.listPatients();

    card.innerHTML = `<ul class="list">${list.map((p) => `<li><a class="item patient" href="#/pacjent/${esc(p.id)}" style="text-decoration:none">

  };
  draw();
  $("#q", view).oninput = (e) => { state.search = e.target.value; draw(); };
}

async function viewPatient(view, id) {
  view.innerHTML = `<div class="loading">Wczytywanie…</div>`;
  const [p, visits] = await Promise.all([api.getPatient(id), api.listPatientVisits(id)]);
  if (!p) { view.innerHTML = `<a class="back" href="#/pacjenci">‹ Pacjenci</a><div class="card empty">Nie znaleziono pacjenta.</div>`; return; }

  const done = visits.filter((v) => v.status === "odbyta");
  const unpaid = done.filter((v) => v.kwota > 0 && !v.oplacona).reduce((s, v) => s + +v.kwota, 0);
  const field = (label, val) => val ? `<div><dt>${label}</dt><dd>${esc(val)}</dd></div>` : "";
  const insurers = [...new Set(visits.filter((v) => v.platnik === "ubezpieczenie").map(payerName))];

  view.innerHTML = `
    <a class="back" href="#/pacjenci">‹ Pacjenci</a>
    <div class="page-head"><h1>${esc(p.imie)} ${esc(p.nazwisko)}</h1>
      <div class="actions">
        <button class="btn" id="edit">Edytuj dane</button>
        <button class="btn btn-primary hide-sm" id="add-visit">+ Nowa wizyta</button>
      </div>
    </div>
    <div class="detail">
      <div class="card info">
        <dl>
          ${field("PESEL", p.pesel)}
          ${field("Data urodzenia", p.data_urodzenia && fmt.date(p.data_urodzenia))}
          ${p.telefon ? `<div><dt>Telefon</dt><dd><a href="tel:${esc(p.telefon.replace(/\s/g, ""))}">${esc(p.telefon)}</a></dd></div>` : ""}
          ${p.email ? `<div><dt>E-mail</dt><dd><a href="mailto:${esc(p.email)}">${esc(p.email)}</a></dd></div>` : ""}
          ${field("Adres", p.adres)}
          <div><dt>Płatnik</dt><dd>${esc(patientPayerLabel(p))}${p.platnik === "ubezpieczenie" && p.nr_polisy ? " · nr " + esc(p.nr_polisy) : ""}</dd></div>
          ${field("Ubezpieczenia w wizytach", insurers.filter((x) => x !== patientPayerLabel(p)).join(", "))}
          ${field("Notatki", p.notatki)}
          <div><dt>Wizyty</dt><dd>${visits.length} łącznie, ${done.length} odbytych</dd></div>
          ${unpaid ? `<div><dt>Do zapłaty</dt><dd style="color:var(--warn);font-weight:650">${fmt.money(unpaid)}</dd></div>` : ""}
        </dl>
      </div>
      <div>
        <h3>Historia wizyt</h3>
        <div class="card">${visits.length
          ? `<ul class="list">${visits.map((v) => visitItem(v, { showDate: true })).join("")}</ul>`
          : `<div class="empty">Brak wizyt.</div>`}</div>
      </div>
    </div>`;
  $("#edit", view).onclick = () => patientModal(p);
  $("#add-visit", view).onclick = () => visitModal({ pacjent_id: p.id, pacjent: p, data_wizyty: defaultVisitDate() });
  bindVisitClicks(view, visits);
}

// =====================================================================
//  WIDOK: RAPORT MIESIĘCZNY
// =====================================================================
async function viewReport(view) {
  const [y, m] = state.month.split("-").map(Number);
  const from = new Date(y, m - 1, 1), to = new Date(y, m, 1);
  const fz = state.reportFizjo ? byId("fizjo", state.reportFizjo) : null;

  // Grupy pozycji cennika do filtra: prywatne + każdy ubezpieczyciel
  const groups = [{ id: "", name: "Wizyty prywatne", items: priceList(null) },
    ...state.dict.ubezp.map((u) => ({ id: u.id, name: u.nazwa, items: priceList(u.id) }))].filter((g) => g.items.length);
  const typesSet = new Set(state.reportTypes.filter((id) => byId("rodzaje", id)));
  const typesLabel = () => !typesSet.size ? "Wszystkie rodzaje wizyt"
    : typesSet.size === 1 ? byId("rodzaje", [...typesSet][0])?.nazwa : `Rodzaje wizyt: ${typesSet.size} wybrane`;

  view.innerHTML = `
    <div class="page-head"><h1>Raport</h1>
      <div class="actions">
        <button class="btn" id="csv">Eksport CSV</button>
        <button class="btn hide-sm" onclick="print()">Drukuj</button>
      </div>
    </div>
    <div class="daybar filters"><input type="month" id="month" value="${esc(state.month)}" aria-label="Miesiąc">
      ${fizjoFilterSelect("rep-fizjo", state.reportFizjo)}
      <select class="select-sm" id="rep-payer" aria-label="Płatnik">
        <option value="">Wszyscy płatnicy</option>
        <option value="prywatny" ${state.reportPayer === "prywatny" ? "selected" : ""}>Prywatni</option>
        <option value="ubezpieczenie" ${state.reportPayer === "ubezpieczenie" ? "selected" : ""}>Wszyscy ubezpieczyciele</option>
        ${state.dict.ubezp.length ? `<optgroup label="Ubezpieczyciel">${state.dict.ubezp.map((u) =>
          `<option value="${esc(u.id)}" ${state.reportPayer === u.id ? "selected" : ""}>${esc(u.nazwa)}${u.aktywny === false ? " (nieaktywny)" : ""}</option>`).join("")}</optgroup>` : ""}
      </select>
      <details class="multi" id="rep-types">
        <summary class="select-sm"><span id="types-label">${esc(typesLabel())}</span></summary>
        <div class="multi-panel">
          <input type="search" class="multi-search" placeholder="Szukaj wizyty…" aria-label="Szukaj rodzaju wizyty">
          <div class="multi-actions"><button type="button" class="link" data-all>Zaznacz wszystkie</button><button type="button" class="link" data-none>Wyczyść</button></div>
          <div class="multi-list">${groups.length ? groups.map((g) => `<div class="multi-group">
            <button type="button" class="multi-group-head" data-group="${esc(g.id)}">${esc(g.name)}</button>
            ${g.items.map((r) => `<label data-name="${esc(norm(r.nazwa + " " + (r.kod || "") + " " + g.name))}"><input type="checkbox" value="${esc(r.id)}" ${typesSet.has(r.id) ? "checked" : ""}>
              <span>${esc(r.nazwa)}${r.kod ? ` <small>${esc(r.kod)}</small>` : ""}${r.aktywny === false ? " <small>(nieaktywna)</small>" : ""}</span></label>`).join("")}
          </div>`).join("") : `<p class="muted">Brak pozycji w cennikach.</p>`}</div>
        </div>
      </details>
      <button class="btn btn-sm btn-ghost" id="rep-clear" ${state.reportFizjo || state.reportPayer || typesSet.size ? "" : "hidden"}>Wyczyść filtry</button>
    </div>
    <div id="stats"></div>
    <div id="payers"></div>
    <div class="card" id="rep-table"><div class="loading">Wczytywanie…</div></div>`;

  $("#month", view).onchange = (e) => { if (e.target.value) { state.month = e.target.value; render(); } };
  $("#rep-fizjo", view)?.addEventListener("change", (e) => { state.reportFizjo = e.target.value; render(); });
  $("#rep-payer", view).onchange = (e) => { state.reportPayer = e.target.value; render(); };
  $("#rep-clear", view).onclick = () => { state.reportFizjo = ""; state.reportPayer = ""; state.reportTypes = []; render(); };

  const allVisits = await api.listVisits(from, to);
  let visits = [];
  const sum = (arr, f = (v) => +v.kwota || 0) => arr.reduce((s, v) => s + f(v), 0);
  const payOf = (v) => (v.status === "odbyta" ? payout(v) || 0 : 0);

  const draw = () => {
    visits = allVisits;
    if (state.reportFizjo) visits = visits.filter((v) => v.fizjoterapeuta_id === state.reportFizjo);
    if (state.reportPayer === "prywatny") visits = visits.filter((v) => v.platnik !== "ubezpieczenie");
    else if (state.reportPayer === "ubezpieczenie") visits = visits.filter((v) => v.platnik === "ubezpieczenie");
    else if (state.reportPayer) visits = visits.filter((v) => v.platnik === "ubezpieczenie" && v.ubezpieczyciel_id === state.reportPayer);
    if (typesSet.size) visits = visits.filter((v) => typesSet.has(v.rodzaj_id));

    const done = visits.filter((v) => v.status === "odbyta");
    const payTotal = sum(done, payOf);
    $("#stats", view).innerHTML = `<div class="stats">
      <div class="stat"><b>${done.length}</b><span>Odbyte wizyty</span></div>
      <div class="stat"><b>${fmt.money(sum(done))}</b><span>Przychód</span></div>
      <div class="stat"><b>${fmt.money(sum(done.filter((v) => !v.oplacona)))}</b><span>Nieopłacone</span></div>
      <div class="stat stat-accent"><b>${fmt.money(payTotal)}</b><span>${fz ? "Do wypłaty: " + esc(personName(fz)) : "Wynagrodzenia fizjoterapeutów"}</span></div>
    </div>`;

    if (done.length) {
      const g = new Map();
      done.forEach((v) => { const k = payerName(v); g.set(k, [...(g.get(k) || []), v]); });
      $("#payers", view).innerHTML = `<h3>Według płatnika (odbyte)</h3><div class="card" style="margin-bottom:18px"><div class="table-wrap"><table>
        <thead><tr><th>Płatnik</th><th class="num">Wizyty</th><th class="num">Kwota</th><th class="num">Nieopłacone</th><th class="num">Dla fizjoterapeutów</th></tr></thead>
        <tbody>${[...g].sort((a, b) => a[0] === "Prywatnie" ? -1 : b[0] === "Prywatnie" ? 1 : a[0].localeCompare(b[0], "pl"))
          .map(([k, l]) => `<tr><td>${esc(k)}</td><td class="num">${l.length}</td><td class="num">${fmt.money(sum(l))}</td><td class="num">${fmt.money(sum(l.filter((v) => !v.oplacona)))}</td><td class="num">${fmt.money(sum(l, payOf))}</td></tr>`).join("")}</tbody>
      </table></div></div>`;
    } else $("#payers", view).innerHTML = "";

    const card = $("#rep-table", view);
    if (!visits.length) { card.innerHTML = `<div class="empty">Brak wizyt dla wybranych filtrów.</div>`; return; }
    card.innerHTML = `<div class="table-wrap"><table class="report">
      <thead><tr><th>Data</th><th>Pacjent</th><th>Wizyta</th>${fz ? "" : "<th>Fizjoterapeuta</th>"}<th>Płatnik</th><th>Status</th><th class="num">Kwota</th><th class="num pay-col">Dla fizjo&shy;terapeuty</th></tr></thead>
      <tbody>${visits.map((v) => {
        const p = payout(v);
        const counted = v.status === "odbyta";
        return `<tr data-visit="${esc(v.id)}" class="${counted ? "" : "row-muted"}">
          <td class="c-date">${esc(new Date(v.data_wizyty).toLocaleDateString("pl-PL", { day: "2-digit", month: "2-digit" }))}<small class="muted"> ${esc(fmt.time(v.data_wizyty))}</small></td>
          <td class="c-pat">${esc(fullName(v.pacjent))}</td><td class="wrap c-type">${esc(v.rodzaj || "")}</td>
          ${fz ? "" : `<td class="c-fz">${esc(fizjoName(v.fizjoterapeuta_id))}</td>`}<td class="wrap c-payer">${esc(payerName(v))}</td>
          <td class="c-status"><span class="badge b-${esc(v.status)}">${esc(STATUSY[v.status])}</span></td>
          <td class="num c-amount">${v.kwota != null ? esc(fmt.money(v.kwota)) : ""}${v.status === "odbyta" && v.kwota > 0 && !v.oplacona ? `<br><small class="unpaid">nieopłacona</small>` : ""}</td>
          <td class="num pay-col"><button type="button" class="pay-btn ${v.wynagrodzenie == null ? "calc" : ""}" data-pay="${esc(v.id)}"
            title="Kliknij, aby zmienić kwotę dla fizjoterapeuty">${p != null ? esc(fmt.money(p)) : "—"}</button></td></tr>`;
      }).join("")}
      </tbody>
      <tfoot><tr><td colspan="${fz ? 5 : 6}" class="c-sumlabel">Suma${fz ? " do wypłaty — " + esc(personName(fz)) : ""} <span class="muted">(tylko wizyty odbyte)</span></td>
        <td class="num c-amount">${fmt.money(sum(done))}</td><td class="num pay-col"><b>${fmt.money(payTotal)}</b></td></tr></tfoot>
      </table></div>`;
    bindVisitClicks(card, visits);
    $$("[data-pay]", card).forEach((btn) => btn.onclick = (e) => { e.stopPropagation(); editPay(btn); });
  };

  // Edycja kwoty dla fizjoterapeuty bezpośrednio w tabeli
  const editPay = (btn) => {
    const v = allVisits.find((x) => x.id === btn.dataset.pay);
    const td = btn.parentElement;
    const cur = payout(v);
    td.innerHTML = `<input type="text" class="pay-input" inputmode="decimal" autocomplete="off" value="${cur != null ? String(cur).replace(".", ",") : ""}" placeholder="z cennika" aria-label="Kwota dla fizjoterapeuty">`;
    const input = $("input", td);
    input.onclick = (e) => e.stopPropagation();
    input.focus(); input.select();
    let done = false;
    const finish = async (saveIt) => {
      if (done) return; done = true;
      if (saveIt) {
        const raw = input.value.trim();
        const val = raw === "" ? null : Math.round(+raw.replace(/\s|zł/g, "").replace(",", ".") * 100) / 100;
        if (val != null && (isNaN(val) || val < 0)) { toast("Podaj poprawną kwotę"); done = false; input.focus(); return; }
        if (val !== (v.wynagrodzenie != null ? +v.wynagrodzenie : null)) {
          try {
            await api.saveVisit({ id: v.id, wynagrodzenie: val });
            v.wynagrodzenie = val;
            toast(val == null ? "Przywrócono stawkę z cennika" : "Zapisano kwotę dla fizjoterapeuty");
          } catch (err) { toast(polishError(err)); }
        }
      }
      draw();
    };
    input.onkeydown = (e) => {
      if (e.key === "Enter") { e.preventDefault(); finish(true); }
      else if (e.key === "Escape") { e.preventDefault(); e.stopPropagation(); finish(false); }
    };
    input.onblur = () => finish(true);
  };

  // Filtr rodzajów wizyt (wielokrotny wybór)
  const det = $("#rep-types", view);
  const applyTypes = () => {
    state.reportTypes = [...typesSet];
    $("#types-label", view).textContent = typesLabel();
    det.classList.toggle("on", typesSet.size > 0);
    $("#rep-clear", view).hidden = !(state.reportFizjo || state.reportPayer || typesSet.size);
    draw();
  };
  det.classList.toggle("on", typesSet.size > 0);
  $$('.multi-list input[type="checkbox"]', det).forEach((c) => c.onchange = () => { c.checked ? typesSet.add(c.value) : typesSet.delete(c.value); applyTypes(); });
  const visibleBoxes = () => $$(".multi-list label", det).filter((l) => !l.hidden).map((l) => $("input", l));
  $("[data-all]", det).onclick = () => { visibleBoxes().forEach((c) => { c.checked = true; typesSet.add(c.value); }); applyTypes(); };
  $("[data-none]", det).onclick = () => { $$('.multi-list input', det).forEach((c) => (c.checked = false)); typesSet.clear(); applyTypes(); };
  $$("[data-group]", det).forEach((h) => h.onclick = () => {
    const boxes = $$("input", h.parentElement);
    const all = boxes.every((c) => c.checked);
    boxes.forEach((c) => { c.checked = !all; all ? typesSet.delete(c.value) : typesSet.add(c.value); });
    applyTypes();
  });
  $(".multi-search", det).oninput = (e) => {
    const q = norm(e.target.value);
    $$(".multi-group", det).forEach((g) => {
      let any = false;
      $$("label", g).forEach((l) => { l.hidden = q && !l.dataset.name.includes(q); any ||= !l.hidden; });
      g.hidden = !any;
    });
  };

  draw();

  $("#csv", view).onclick = () => {
    const head = ["Data", "Godzina", "Nazwisko", "Imię", "PESEL", "Rodzaj", "Kod usługi", "Czas (min)", "Fizjoterapeuta", "Płatnik", "Nr autoryzacji",
      "Status", "Kwota", "Opłacona", "Dla fizjoterapeuty", "Opis", "Zalecenia"];
    const q = (s) => `"${String(s ?? "").replace(/"/g, '""')}"`;
    const money = (n) => (n != null ? String(n).replace(".", ",") : "");
    const rows = visits.map((v) => [fmt.date(v.data_wizyty), fmt.time(v.data_wizyty), v.pacjent?.nazwisko, v.pacjent?.imie, v.pacjent?.pesel,
      v.rodzaj, byId("rodzaje", v.rodzaj_id)?.kod || "", v.czas_trwania, fizjoName(v.fizjoterapeuta_id), payerName(v), v.nr_autoryzacji, STATUSY[v.status],
      money(v.kwota), v.oplacona ? "tak" : "nie", money(payout(v)), v.opis, v.zalecenia]);
    const done = visits.filter((v) => v.status === "odbyta");
    rows.push([], ["Suma (odbyte)", "", "", "", "", "", "", "", "", "", "", "", money(sum(done)), "", money(sum(done, payOf))]);
    const csv = "﻿" + [head, ...rows].map((r) => r.map(q).join(";")).join("\r\n");
    const slug = (s) => norm(s).replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
    const parts = [state.month,
      fz ? slug(personName(fz)) : "",
      state.reportPayer === "prywatny" ? "prywatni" : state.reportPayer === "ubezpieczenie" ? "ubezpieczyciele" : state.reportPayer ? slug(byId("ubezp", state.reportPayer)?.nazwa || "") : ""].filter(Boolean);
    const a = Object.assign(document.createElement("a"), {
      href: URL.createObjectURL(new Blob([csv], { type: "text/csv;charset=utf-8" })),
      download: `wizyty-${parts.join("-")}.csv`,
    });
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  };
}

// =====================================================================
//  WIDOK: USTAWIENIA (rodzaje wizyt, fizjoterapeuci, ubezpieczyciele)
// =====================================================================
async function viewSettings(view, tab, sub) {
  await loadDicts();
  if (tab === "ubezp" && sub) return viewInsurer(view, sub);
  const tabs = { rodzaje: "Wizyty prywatne", ubezp: "Ubezpieczyciele", fizjo: "Fizjoterapeuci", konto: "Konto" };
  if (!tabs[tab]) tab = "rodzaje";
  const addLabel = { rodzaje: "+ Nowa wizyta w cenniku", fizjo: "+ Nowy fizjoterapeuta", ubezp: "+ Nowy ubezpieczyciel" }[tab];
  view.innerHTML = `
    <div class="page-head"><h1>Ustawienia</h1><div class="actions"></div></div>
    <div class="tabs">${Object.entries(tabs).map(([k, l]) => `<a href="#/ustawienia/${k}" class="${k === tab ? "on" : ""}">${l}</a>`).join("")}</div>
    <div id="settings-body"></div>`;
  const body = $("#settings-body", view);

  if (tab === "konto") {
    body.innerHTML = `<div class="card info">
      <dl><div><dt>Zalogowano jako</dt><dd>${esc(state.user?.email || "")}</dd></div>
      ${DEMO ? `<div><dt>Tryb</dt><dd>Demo — dane tylko w tej przeglądarce</dd></div>` : ""}</dl>
      <div><button class="btn" id="logout-s">${DEMO ? "Wyczyść dane demo" : "Wyloguj"}</button></div></div>`;
    $("#logout-s", body).onclick = logout;
    return;
  }

  const items = tab === "rodzaje" ? priceList(null) : state.dict[tab];
  const row = (x) => {
    let title, sub, lead = "";
    if (tab === "rodzaje") { title = x.nazwa; sub = rodzajSub(x); }
    else if (tab === "fizjo") {
      title = personName(x); sub = [x.telefon, x.email].filter(Boolean).join(" · ") || "—";
      lead = `<div class="avatar" style="background:${esc(x.kolor)};color:#fff">${esc(initials(x))}</div>`;
    } else {
      const n = priceList(x.id).length;
      title = x.nazwa; sub = [`${n} ${n === 1 ? "wizyta" : n > 1 && n < 5 ? "wizyty" : "wizyt"} w cenniku`, x.nip ? "NIP " + x.nip : "", x.telefon].filter(Boolean).join(" · ");
    }
    return `<li><button class="item ${lead ? "patient" : "plain"}" data-id="${esc(x.id)}">
      ${lead}<div class="who"><b>${esc(title)}</b><span>${esc(sub)}</span></div>
      <div class="meta">${x.aktywny === false ? '<span class="badge b-odwolana">Nieaktywny</span>' : '<span class="muted">›</span>'}</div>
    </button></li>`;
  };
  const hints = {
    rodzaje: "Cennik wizyt prywatnych. Przy wizycie prywatnej wybierasz z tej listy — podpowie czas trwania i cenę.",
    fizjo: "Fizjoterapeuci, których można przypisać do wizyty. Kolor wyróżnia ich wizyty w kalendarzu.",
    ubezp: "Zakłady ubezpieczeń, z którymi współpracujesz. Kliknij zakład, aby ustawić jego własny cennik wizyt.",
  };
  body.innerHTML = `
    <div class="toolbar" style="justify-content:space-between;align-items:center;flex-wrap:wrap">
      <p class="muted" style="margin:0;flex:1;min-width:220px">${hints[tab]}</p>
      <button class="btn btn-primary" id="dict-add">${addLabel}</button>
    </div>
    <div class="card">${items.length ? `<ul class="list">${items.map(row).join("")}</ul>` : `<div class="empty">Brak pozycji. Dodaj pierwszą.</div>`}</div>`;
  $("#dict-add", body).onclick = () => dictModal(tab, {});
  $$("[data-id]", body).forEach((b) => b.onclick = () => {
    if (tab === "ubezp") location.hash = `#/ustawienia/ubezp/${b.dataset.id}`;
    else dictModal(tab, items.find((x) => x.id === b.dataset.id));
  });
}

const rodzajSub = (r) => {
  const own = state.dict.stawki.filter((s) => s.rodzaj_id === r.id).length;
  return [r.kod ? "kod " + r.kod : "", `${r.czas_trwania} min`, r.cena != null ? fmt.money(r.cena) : "",
    r.wynagrodzenie != null ? "fizjo " + fmt.money(r.wynagrodzenie) : "", own ? `${own} ${own === 1 ? "stawka indywidualna" : "stawki indywidualne"}` : ""].filter(Boolean).join(" · ");
};

// Szczegóły ubezpieczyciela + jego cennik wizyt
function viewInsurer(view, id) {
  const u = byId("ubezp", id);
  if (!u) { view.innerHTML = `<a class="back" href="#/ustawienia/ubezp">‹ Ubezpieczyciele</a><div class="card empty">Nie znaleziono ubezpieczyciela.</div>`; return; }
  const list = priceList(u.id);
  view.innerHTML = `
    <a class="back" href="#/ustawienia/ubezp">‹ Ubezpieczyciele</a>
    <div class="page-head"><h1>${esc(u.nazwa)}</h1>
      <div class="actions"><button class="btn" id="ins-edit">Edytuj dane</button></div>
    </div>
    <div class="detail">
      <div class="card info"><dl>
        ${u.aktywny === false ? `<div><dt>Status</dt><dd>Nieaktywny</dd></div>` : ""}
        ${u.nip ? `<div><dt>NIP</dt><dd>${esc(u.nip)}</dd></div>` : ""}

const modal = $("#modal");
function openModal({ title, body, submitLabel = "Zapisz", onSubmit, onDelete, onReady }) {
  const form = $("#modal-form");
  $("#modal-title").textContent = title;
  $("#modal-body").innerHTML = body;
  $("#modal-foot").innerHTML =
    (onDelete ? `<button type="button" class="btn btn-danger" data-act="delete">Usuń</button><span class="spacer"></span>` : "") +
    `<button type="button" class="btn" data-act="cancel">Anuluj</button>` +
    `<button type="submit" class="btn btn-primary" data-act="save">${esc(submitLabel)}</button>`;

  const busy = (on) => $$("#modal-foot button").forEach((b) => (b.disabled = on));
  form.onsubmit = async (e) => {
    e.preventDefault();
    if (e.submitter?.value === "cancel") return modal.close();
    busy(true);
    try { await onSubmit(new FormData(form)); modal.close(); }
    catch (err) { if (!(err instanceof SilentError)) { console.error(err); toast(polishError(err)); } }
    finally { busy(false); }
  };
  $('[data-act="cancel"]').onclick = () => modal.close();
  const del = $('[data-act="delete"]');
  if (del) del.onclick = async () => {
    busy(true);
    try { if (await onDelete()) modal.close(); }
    catch (err) { toast("Błąd: " + polishError(err)); }
    finally { busy(false); }
  };
  onReady?.($("#modal-body"));
  modal.showModal();
  $("#modal-body").scrollTop = 0;
  if (matchMedia("(min-width: 821px)").matches)
    setTimeout(() => $("#modal-body input:not([type=hidden]):not([type=radio]), #modal-body select")?.focus({ preventScroll: true }), 50);
}

const val = (fd, k) => { const v = (fd.get(k) ?? "").toString().trim(); return v === "" ? null : v; };
const numOrNull = (v) => (v == null || v === "" ? null : +String(v).replace(",", "."));

function payerFieldsHtml({ prefix = "", platnik = "prywatny", ubezpieczyciel_id = null, nrName, nrLabel, nrValue = "", note = false }) {

  const ins = platnik === "ubezpieczenie";
  return `<div class="field">
      <span class="field-label">Płatnik${note ? ` <span class="payer-note" data-payer-note="${prefix}" hidden>· ustawiono wg danych pacjenta</span>` : ""}</span>
      <div class="seg seg-full" role="radiogroup">
        <label><input type="radio" name="${prefix}platnik" value="prywatny" ${ins ? "" : "checked"}><span>Prywatny</span></label>
        <label><input type="radio" name="${prefix}platnik" value="ubezpieczenie" ${ins ? "checked" : ""}><span>Ubezpieczenie</span></label>
      </div>
    </div>
    <div class="row" data-ubezp-box="${prefix}" ${ins ? "" : "hidden"}>
      <label>Zakład ubezpieczeń *${list.length ? "" : ` <a href="#/ustawienia/ubezp" data-close class="hint-link">(dodaj w Ustawieniach)</a>`}
        <select name="${prefix}ubezpieczyciel_id">
          <option value="">— wybierz —</option>

        </select></label>
      <label>${esc(nrLabel)}<input name="${prefix}${nrName}" value="${esc(nrValue)}" autocomplete="off"></label>
    </div>`;
}
function bindPayer(b, prefix = "", { required = true, onChange } = {}) {
  const box = $(`[data-ubezp-box="${prefix}"]`, b);
  const sel = $(`[name="${prefix}ubezpieczyciel_id"]`, b);
  const note = $(`[data-payer-note="${prefix}"]`, b);
  const isIns = () => $(`[name="${prefix}platnik"]:checked`, b)?.value === "ubezpieczenie";
  const update = () => { box.hidden = !isIns(); if (required) sel.required = isIns(); onChange?.({ ins: isIns(), insurer: isIns() ? sel.value : "" }); };
  $$(`[name="${prefix}platnik"]`, b).forEach((r) => r.addEventListener("change", () => { update(); if (note) note.hidden = true; }));
  sel.addEventListener("change", () => { if (note) note.hidden = true; onChange?.({ ins: isIns(), insurer: isIns() ? sel.value : "" }); });
  update();
  return {
    isIns,
    insurer: () => sel.value,
    set(platnik, ubezpId, { showNote = false } = {}) {
      const p = platnik === "ubezpieczenie" ? "ubezpieczenie" : "prywatny";
      $(`[name="${prefix}platnik"][value="${p}"]`, b).checked = true;
      if (ubezpId && !$(`option[value="${CSS.escape(ubezpId)}"]`, sel) && byId("ubezp", ubezpId)) {
        sel.insertAdjacentHTML("beforeend", `<option value="${esc(ubezpId)}">${esc(byId("ubezp", ubezpId).nazwa)}</option>`);
      }
      sel.value = p === "ubezpieczenie" ? (ubezpId || "") : "";
      update();
      if (note) note.hidden = !showNote;
    },
  };
}
const patientPayerLabel = (p) => p?.platnik === "ubezpieczenie" ? (byId("ubezp", p.ubezpieczyciel_id)?.nazwa || "Ubezpieczenie") : "Prywatny";

// Komunikat o możliwym duplikacie pacjenta
function duplicateAlert(dups, { allowForce, selectLabel = "Wybierz" }) {
  const list = [...dups.byPesel, ...dups.byName];
  return `<div class="dup-alert" role="alert">
    <b>${dups.byPesel.length ? "Pacjent z tym numerem PESEL już istnieje w bazie." : "W bazie jest już pacjent o tym imieniu i nazwisku."}</b>
    <ul>${list.map((p) => `<li><span>${esc(personName(p))}${p.pesel ? " · PESEL " + esc(p.pesel) : ""}${p.telefon ? " · " + esc(p.telefon) : ""}</span>
      <button type="button" class="btn btn-sm" data-dup-pick="${esc(p.id)}">${esc(selectLabel)}</button></li>`).join("")}</ul>
    ${allowForce && !dups.byPesel.length ? `<button type="button" class="btn btn-sm btn-ghost" data-dup-force>To inna osoba — dodaj mimo to</button>` : ""}
  </div>`;
}

function patientModal(p) {
  if (!state.dict.ubezp.length) loadDicts().catch(() => {});
  let force = false;
  let patientsCache = null;
  openModal({
    title: p.id ? "Edycja pacjenta" : "Nowy pacjent",
    body: `
      <div id="dup-box"></div>
      <div class="row">
        <label>Imię *<input name="imie" required value="${esc(p.imie)}" autocomplete="off"></label>
        <label>Nazwisko *<input name="nazwisko" required value="${esc(p.nazwisko)}" autocomplete="off"></label>
      </div>
      <div class="row">
        <label>PESEL<input name="pesel" inputmode="numeric" pattern="\\d{11}" maxlength="11" value="${esc(p.pesel)}" title="11 cyfr"></label>
        <label>Data urodzenia<input name="data_urodzenia" type="date" value="${esc(p.data_urodzenia)}"></label>
      </div>
      <div class="row">
        <label>Telefon<input name="telefon" type="tel" value="${esc(p.telefon)}"></label>
        <label>E-mail<input name="email" type="email" value="${esc(p.email)}"></label>
      </div>
      <label>Adres<input name="adres" value="${esc(p.adres)}"></label>
      ${payerFieldsHtml({ platnik: p.platnik, ubezpieczyciel_id: p.ubezpieczyciel_id, nrName: "nr_polisy", nrLabel: "Nr polisy / karty", nrValue: p.nr_polisy })}
      <label>Notatki (rozpoznanie, przeciwwskazania, uwagi)<textarea name="notatki">${esc(p.notatki)}</textarea></label>`,
    onReady: (b) => {
      bindPayer(b);
      $$("[data-close]", b).forEach((a) => a.addEventListener("click", () => modal.close()));
      $('[name="pesel"]', b).addEventListener("input", (e) => {
        const d = peselToDate(e.target.value);
        if (d && !$('[name="data_urodzenia"]', b).value) $('[name="data_urodzenia"]', b).value = d;
      });
      ["imie", "nazwisko", "pesel"].forEach((n) => $(`[name="${n}"]`, b).addEventListener("input", () => { force = false; $("#dup-box", b).innerHTML = ""; }));
    },
    onSubmit: async (fd) => {
      const row = {
        imie: val(fd, "imie"), nazwisko: val(fd, "nazwisko"), pesel: val(fd, "pesel"),
        data_urodzenia: val(fd, "data_urodzenia"), telefon: val(fd, "telefon"), email: val(fd, "email"),
        adres: val(fd, "adres"), notatki: val(fd, "notatki"),
        platnik: val(fd, "platnik") || "prywatny",
      };
      row.ubezpieczyciel_id = row.platnik === "ubezpieczenie" ? val(fd, "ubezpieczyciel_id") : null;
      row.nr_polisy = row.platnik === "ubezpieczenie" ? val(fd, "nr_polisy") : null;
      if (p.id) row.id = p.id;
      patientsCache ||= await api.listPatients();
      const dups = findDuplicates(patientsCache, row, p.id);
      const blocking = dups.byPesel.length || (!p.id && dups.byName.length && !force);
      if (blocking) {
        const box = $("#dup-box");
        box.innerHTML = duplicateAlert(p.id ? { byPesel: dups.byPesel, byName: [] } : dups, { allowForce: !p.id, selectLabel: "Otwórz kartę" });
        $$("[data-dup-pick]", box).forEach((btn) => btn.onclick = () => { modal.close(); location.hash = `#/pacjent/${btn.dataset.dupPick}`; });
        $("[data-dup-force]", box)?.addEventListener("click", () => { force = true; $("#modal-form").requestSubmit($('[data-act="save"]')); });
        $("#modal-body").scrollTop = 0;
        throw new SilentError();
      }
      const saved = await api.savePatient(row);
      toast(p.id ? "Zapisano zmiany" : "Dodano pacjenta");
      if (!p.id) location.hash = `#/pacjent/${saved.id}`; else render();
    },
    onDelete: p.id ? async () => {
      if (!confirm(`Usunąć pacjenta ${p.imie} ${p.nazwisko} wraz z całą historią wizyt? Tej operacji nie można cofnąć.`)) return false;
      await api.deletePatient(p.id);
      toast("Usunięto pacjenta");
      location.hash = "#/pacjenci";
      return true;
    } : null,
  });
}
