        <select name="rodzaj_id"></select></label>
      <div class="row">
        <label>Data i godzina *<input name="data_wizyty" type="datetime-local" required value="${toLocalInput(d)}"></label>
        <label>Czas trwania (min)<input name="czas_trwania" type="number" min="5" max="600" step="5" value="${esc(v.czas_trwania ?? 45)}"></label>
      </div>
      <label>Fizjoterapeuta${fizjoL.length ? "" : " " + setupLink("fizjo", "(dodaj w Ustawieniach)")}
        <select name="fizjoterapeuta_id">
          <option value="">— nie przypisano —</option>
          ${fizjoL.map((f) => `<option value="${esc(f.id)}" ${f.id === fizjoSel ? "selected" : ""}>${esc(personName(f))}</option>`).join("")}
        </select></label>

      <div class="row">
        <label>Status<select name="status">
          ${Object.entries(STATUSY).map(([k, l]) => `<option value="${k}" ${k === (v.status || "zaplanowana") ? "selected" : ""}>${l}</option>`).join("")}
        </select></label>
        <label>Kwota (zł)<input name="kwota" type="number" min="0" step="0.01" inputmode="decimal" value="${esc(v.kwota)}"></label>
      </div>
      <label>Dla fizjoterapeuty (zł) <span class="muted" id="pay-hint" style="font-weight:500"></span>
        <input name="wynagrodzenie" type="number" min="0" step="0.01" inputmode="decimal" value="${esc(v.wynagrodzenie)}"></label>
      <label class="check"><input name="oplacona" type="checkbox" ${v.oplacona ? "checked" : ""}> Opłacona</label>
      <label>Opis / przebieg wizyty<textarea name="opis">${esc(v.opis)}</textarea></label>
      <label>Zalecenia<textarea name="zalecenia">${esc(v.zalecenia)}</textarea></label>
      ${v.pacjent_id && v.id ? `<a href="#/pacjent/${esc(v.pacjent_id)}" data-close>Przejdź do karty pacjenta ›</a>` : ""}`,

    onReady: (b) => {
      $$("[data-close]", b).forEach((a) => a.addEventListener("click", () => modal.close()));

      // --- Wizyta z cennika (prywatnego albo wybranego ubezpieczyciela) → czas trwania i cena
      const rodzajSel = $('[name="rodzaj_id"]', b), czas = $('[name="czas_trwania"]', b), kwota = $('[name="kwota"]', b);
      let autoPrice = v.id ? null : kwota.value;
      let keepId = v.rodzaj_id || "";
      rodzajSel.onchange = () => {
        const o = rodzajSel.selectedOptions[0];
        keepId = rodzajSel.value;
        if (!o || !o.value) return;
        if (o.dataset.czas) czas.value = o.dataset.czas;
        if (o.dataset.cena !== "" && (kwota.value === "" || kwota.value === autoPrice)) { kwota.value = o.dataset.cena; autoPrice = kwota.value; }
      };
      const rebuildRodzaje = ({ ins, insurer }) => {
        const label = $("#rodzaj-label", b), hint = $("#rodzaj-hint", b);
        if (ins && !insurer) {
          label.textContent = "Wizyta";
          hint.innerHTML = "";
          rodzajSel.innerHTML = `<option value="">— najpierw wybierz zakład ubezpieczeń —</option>`;
          rodzajSel.disabled = true;
          return;
        }
        rodzajSel.disabled = false;
        const owner = ins ? insurer : null;
        let list = priceList(owner).filter((r) => r.aktywny !== false || r.id === keepId);
        const uName = owner ? byId("ubezp", owner)?.nazwa : "";
        label.textContent = owner ? `Wizyta z cennika ${uName}` : "Wizyta (cennik prywatny)";
        const legacy = v.rodzaj && !v.rodzaj_id && !keepId ? `<option value="">${esc(v.rodzaj)}</option>` : `<option value="">— wybierz —</option>`;
        rodzajSel.innerHTML = legacy + list.map((r) =>
          `<option value="${esc(r.id)}" data-czas="${esc(r.czas_trwania)}" data-cena="${esc(r.cena ?? "")}">${esc(rodzajLabel(r))}${r.kod ? " · " + esc(r.kod) : ""}</option>`).join("");
        hint.innerHTML = list.length ? "" : `<a href="#/ustawienia/${owner ? "ubezp/" + esc(owner) : "rodzaje"}" class="hint-link" data-close>(brak wizyt w cenniku — dodaj w Ustawieniach)</a>`;
        $("[data-close]", hint)?.addEventListener("click", () => modal.close());
        if (list.some((r) => r.id === keepId)) rodzajSel.value = keepId;
        else {
          rodzajSel.value = "";
          if (autoPrice != null && kwota.value === autoPrice) kwota.value = "";
        }
        b._syncPay?.();
      };

      // --- Wynagrodzenie fizjoterapeuty: podpowiadane ze stawki (indywidualnej lub domyślnej)
      const pay = $('[name="wynagrodzenie"]', b), payHint = $("#pay-hint", b), fizjoS = $('[name="fizjoterapeuta_id"]', b);
      const r0 = rateFor(v.rodzaj_id, v.fizjoterapeuta_id);
      let autoPay = !v.id ? "" : (v.wynagrodzenie == null || (r0 != null && +v.wynagrodzenie === r0) ? pay.value : null);
      const syncPay = () => {
        const r = rateFor(rodzajSel.value, fizjoS.value);
        payHint.textContent = r != null ? `· stawka z cennika: ${fmt.money(r)}` : (rodzajSel.value && fizjoS.value ? "· brak stawki w cenniku" : "");
        if (autoPay != null && pay.value === autoPay) { pay.value = r != null ? String(r) : ""; autoPay = pay.value; }
      };
      rodzajSel.addEventListener("change", syncPay);
      fizjoS.addEventListener("change", syncPay);
      b._syncPay = syncPay;

      // --- Płatnik wizyty i płatnik nowego pacjenta
      const visitPayer = bindPayer(b, "", { onChange: rebuildRodzaje });
      const npPayer = bindPayer(b, "np_", { required: false });

      // --- Wyszukiwarka pacjentów
      const hidden = $('[name="pacjent_id"]', b);
      const sel = $(".combo-selected", b), search = $(".combo-search", b), q = $("#combo-q", b), list = $("#combo-list", b);
      const np = $("#newpat", b);
      let hi = 0, results = [];

      const pick = (p, applyPayer = true) => {
        hidden.value = p.id;
        if (applyPayer) visitPayer.set(p.platnik, p.ubezpieczyciel_id, { showNote: true });
        $("#cs-av", b).textContent = initials(p);
        $("#cs-name", b).textContent = fullName(p);
        $("#cs-sub", b).textContent = [p.pesel ? "PESEL " + p.pesel : "", p.telefon, patientPayerLabel(p)].filter(Boolean).join(" · ");
        sel.hidden = false; search.hidden = true; np.hidden = true; list.hidden = true;
      };
      const unpick = () => {
        hidden.value = ""; sel.hidden = true; search.hidden = false; np.hidden = true;
        q.value = ""; list.hidden = true; q.focus();
      };
      const draw = () => {
        const term = q.value.trim();
        if (!term) { results = []; list.hidden = true; return; }
        results = matchPatients(patients, term).slice(0, 8);
        hi = Math.min(hi, Math.max(results.length - 1, 0));
        list.innerHTML =
          results.map((p, i) => `<li role="option" class="${i === hi ? "hi" : ""}" data-pid="${esc(p.id)}">
            <div class="avatar">${esc(initials(p))}</div>
            <div class="who"><b>${esc(fullName(p))}</b><span>${esc([p.pesel ? "PESEL " + p.pesel : "", p.telefon, patientPayerLabel(p)].filter(Boolean).join(" · "))}</span></div></li>`).join("") +
          (!results.length ? `<li class="none">Brak pacjenta „${esc(term)}” w bazie</li><li class="add" data-new><span>+</span> Dodaj nowego pacjenta „${esc(term)}”</li>` : "");
        list.hidden = false;
        $$("[data-pid]", list).forEach((li) => li.onmousedown = (e) => { e.preventDefault(); pick(patients.find((p) => p.id === li.dataset.pid)); });
        $("[data-new]", list)?.addEventListener("mousedown", (e) => { e.preventDefault(); openNew(); });
      };
      const openNew = () => {
        const term = q.value.trim();
        np.hidden = false; list.hidden = true; search.hidden = true;
        $("#np-dup", b).innerHTML = "";
        npPayer.set("prywatny", null);
        // wstępne wypełnienie z wyszukiwanej frazy
        if (/^\d{11}$/.test(term)) $('[name="np_pesel"]', b).value = term;
        else if (term) {
          const parts = term.split(/\s+/);
          const tc = (s) => (s ? s.charAt(0).toUpperCase() + s.slice(1) : "");
          $('[name="np_imie"]', b).value = parts.length > 1 ? tc(parts[0]) : "";
          $('[name="np_nazwisko"]', b).value = tc(parts.length > 1 ? parts.slice(1).join(" ") : parts[0]);
        }
        setTimeout(() => $(`[name="${$('[name="np_imie"]', b).value ? "np_pesel" : "np_imie"}"]`, b).focus(), 30);
      };
      q.oninput = () => { hi = 0; draw(); };
      q.onfocus = draw;
      q.onblur = () => setTimeout(() => { list.hidden = true; }, 150);
      q.onkeydown = (e) => {
        if (e.key === "ArrowDown") { e.preventDefault(); hi = Math.min(hi + 1, results.length - 1); draw(); }
        else if (e.key === "ArrowUp") { e.preventDefault(); hi = Math.max(hi - 1, 0); draw(); }
        else if (e.key === "Enter") { e.preventDefault(); if (results[hi]) pick(results[hi]); else if (q.value.trim()) openNew(); }
        else if (e.key === "Escape" && !list.hidden) { e.preventDefault(); e.stopPropagation(); list.hidden = true; }
      };
      $("#cs-change", b).onclick = unpick;
      $("#combo-new", b).onclick = openNew;
      $("#np-cancel", b).onclick = () => { np.hidden = true; search.hidden = false; q.focus(); };

      // dodanie nowego pacjenta z poziomu wizyty
      let npForce = false;
      ["np_imie", "np_nazwisko", "np_pesel"].forEach((n) => $(`[name="${n}"]`, b).addEventListener("input", () => { npForce = false; $("#np-dup", b).innerHTML = ""; }));
      b._addNewPatient = async () => {
        const row = {
          imie: $('[name="np_imie"]', b).value.trim(), nazwisko: $('[name="np_nazwisko"]', b).value.trim(),
          pesel: $('[name="np_pesel"]', b).value.trim() || null, telefon: $('[name="np_telefon"]', b).value.trim() || null,
          platnik: npPayer.isIns() ? "ubezpieczenie" : "prywatny",
          ubezpieczyciel_id: npPayer.isIns() ? (npPayer.insurer() || null) : null,
          nr_polisy: npPayer.isIns() ? ($('[name="np_nr_polisy"]', b).value.trim() || null) : null,
        };
        if (row.platnik === "ubezpieczenie" && !row.ubezpieczyciel_id) { toast("Wybierz zakład ubezpieczeń pacjenta"); $('[name="np_ubezpieczyciel_id"]', b).focus(); return null; }
        if (!row.imie || !row.nazwisko) { toast("Podaj imię i nazwisko pacjenta"); $(`[name="${row.imie ? "np_nazwisko" : "np_imie"}"]`, b).focus(); return null; }
        if (row.pesel && !/^\d{11}$/.test(row.pesel)) { toast("PESEL musi mieć 11 cyfr"); $('[name="np_pesel"]', b).focus(); return null; }
        row.data_urodzenia = row.pesel ? peselToDate(row.pesel) : null;
        patients = await api.listPatients();
        const dups = findDuplicates(patients, row);
        if (dups.byPesel.length || (dups.byName.length && !npForce)) {
          const box = $("#np-dup", b);
          box.innerHTML = duplicateAlert(dups, { allowForce: true, selectLabel: "Wybierz tego pacjenta" });
          $$("[data-dup-pick]", box).forEach((btn) => btn.onclick = () => pick(patients.find((p) => p.id === btn.dataset.dupPick)));
          $("[data-dup-force]", box)?.addEventListener("click", () => { npForce = true; $("#np-add", b).click(); });
          return null;
        }
        const saved = await api.savePatient(row);
        patients = [...patients, saved];
        ["np_imie", "np_nazwisko", "np_pesel", "np_telefon", "np_nr_polisy"].forEach((n) => ($(`[name="${n}"]`, b).value = ""));
        pick(saved);
        toast("Dodano pacjenta");
        return saved;
      };
      $("#np-add", b).onclick = async (e) => {
        e.currentTarget.disabled = true;
        const btn = e.currentTarget;
        try { await b._addNewPatient(); } catch (err) { toast(polishError(err)); } finally { btn.disabled = false; }
      };
      $$("#newpat input", b).forEach((i) => i.addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); $("#np-add", b).click(); } }));

      if (selectedPatient) pick(selectedPatient, !v.id);
    },

    onSubmit: async (fd) => {
      const b = $("#modal-body");
      let pacjent_id = val(fd, "pacjent_id");
      if (!pacjent_id && !$("#newpat", b).hidden) {
        const saved = await b._addNewPatient();
        if (!saved) throw new SilentError();
        pacjent_id = saved.id;
      }
      if (!pacjent_id) { toast("Wybierz pacjenta lub dodaj nowego"); $("#combo-q", b)?.focus(); throw new SilentError(); }

      const platnik = val(fd, "platnik") || "prywatny";
      if (platnik === "ubezpieczenie" && !val(fd, "ubezpieczyciel_id")) { toast("Wybierz zakład ubezpieczeń"); throw new SilentError(); }
      const rodzaj_id = val(fd, "rodzaj_id");
      const row = {
        pacjent_id,
        data_wizyty: new Date(val(fd, "data_wizyty")).toISOString(),
        czas_trwania: +(val(fd, "czas_trwania") || 45),
        rodzaj_id,
        rodzaj: rodzaj_id ? byId("rodzaje", rodzaj_id)?.nazwa : (v.rodzaj || null),
        fizjoterapeuta_id: val(fd, "fizjoterapeuta_id"),
        platnik,
        ubezpieczyciel_id: platnik === "ubezpieczenie" ? val(fd, "ubezpieczyciel_id") : null,
        nr_autoryzacji: platnik === "ubezpieczenie" ? val(fd, "nr_autoryzacji") : null,
        status: val(fd, "status") || "zaplanowana",
        kwota: numOrNull(val(fd, "kwota")),
        wynagrodzenie: numOrNull(val(fd, "wynagrodzenie")) ?? rateFor(rodzaj_id, val(fd, "fizjoterapeuta_id")),
        oplacona: fd.get("oplacona") === "on",
        opis: val(fd, "opis"),
        zalecenia: val(fd, "zalecenia"),
      };
      if (v.id) row.id = v.id;
      await api.saveVisit(row);
      if (row.fizjoterapeuta_id) try { localStorage.setItem("rw_ostatni_fizjo", row.fizjoterapeuta_id); } catch {}
      toast(v.id ? "Zapisano wizytę" : "Dodano wizytę");
      if (!v.id && route().name === "wizyty") {
        state.day = startOfDay(new Date(row.data_wizyty));
        if (state.mode === "nadchodzace" && new Date(row.data_wizyty) < new Date()) state.mode = "dzien";
        if (state.fizjo && row.fizjoterapeuta_id !== state.fizjo) state.fizjo = "";
      }
      render();
    },
    onDelete: v.id ? async () => {
      if (!confirm("Usunąć tę wizytę?")) return false;
      await api.deleteVisit(v.id);
      toast("Usunięto wizytę");
      render();
      return true;
    } : null,
  });
}

// =====================================================================
//  LOGOWANIE
// =====================================================================
function showAuth() {
  $("#app").hidden = true;
  $("#auth").hidden = false;
  updateAuthMode();
}

function updateAuthMode() {
  $("#auth-submit").textContent = state.signUpMode ? "Załóż konto" : "Zaloguj";
  $("#auth-toggle").textContent = state.signUpMode ? "Masz konto? Zaloguj się" : "Nie masz konta? Załóż je";
  $('#auth-form [name="password"]').autocomplete = state.signUpMode ? "new-password" : "current-password";
  $("#auth-msg").textContent = "";
}

async function showApp(user) {
  state.user = user;
  $("#auth").hidden = true;
  $("#app").hidden = false;
  $("#user-email").textContent = user.email || "";
  $("#demo-banner").hidden = !DEMO;
  try { await loadDicts(); } catch (err) { console.error(err); }
  render();
}

async function logout() {
  await api.signOut();
  if (!DEMO) { state.user = null; showAuth(); }
}

$("#auth-form").onsubmit = async (e) => {
  e.preventDefault();
  const fd = new FormData(e.target);
  const email = fd.get("email"), password = fd.get("password");
  const msg = $("#auth-msg"), btn = $("#auth-submit");
  msg.className = "msg"; msg.textContent = ""; btn.disabled = true;
  try {
    if (state.signUpMode) {
      const loggedIn = await api.signUp(email, password);
      if (!loggedIn) { msg.className = "msg ok"; msg.textContent = "Konto utworzone. Potwierdź adres e-mail, klikając link w wiadomości."; }
    } else {
      await api.signIn(email, password);
    }
    const user = await api.getUser();
    if (user) showApp(user);
  } catch (err) {
    msg.textContent = polishError(err);
  } finally { btn.disabled = false; }
};
$("#auth-toggle").onclick = () => { state.signUpMode = !state.signUpMode; updateAuthMode(); };
$("#auth-reset").onclick = async () => {
  const email = $('#auth-form [name="email"]').value;
  const msg = $("#auth-msg");
  if (!email) { msg.className = "msg"; msg.textContent = "Wpisz adres e-mail, a potem kliknij ponownie."; return; }
  try { await api.resetPassword(email); msg.className = "msg ok"; msg.textContent = "Wysłaliśmy link do zmiany hasła."; }
  catch (err) { msg.className = "msg"; msg.textContent = polishError(err); }
};
$("#logout").onclick = logout;

function newPasswordModal() {
  openModal({
    title: "Ustaw nowe hasło",
    body: `<label>Nowe hasło<input name="pw" type="password" minlength="8" required autocomplete="new-password"></label>`,
    onSubmit: async (fd) => { await api.updatePassword(fd.get("pw")); toast("Hasło zmienione"); },
  });
}

// =====================================================================
//  MOTYW JASNY / CIEMNY
// =====================================================================
const THEME_ICONS = `<svg class="moon" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5Z"/></svg>` +
  `<svg class="sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>`;

function applyTheme(theme) {
  document.documentElement.dataset.theme = theme;
  try { localStorage.setItem("rw_motyw", theme); } catch {}
  $('meta[name="theme-color"]')?.setAttribute("content", theme === "dark" ? "#1d1813" : "#a0714a");
  $$("[data-theme-toggle]").forEach((b) => {
    const label = theme === "dark" ? "Włącz jasny motyw" : "Włącz ciemny motyw";
    b.setAttribute("aria-label", label); b.title = label;
  });
}
function setupThemeButtons(root = document) {
  $$("[data-theme-toggle]", root).forEach((b) => {
    if (b.dataset.ready) return;
    b.dataset.ready = "1";
    b.innerHTML = THEME_ICONS;
    b.onclick = () => applyTheme(document.documentElement.dataset.theme === "dark" ? "light" : "dark");
  });
  applyTheme(document.documentElement.dataset.theme || "light");
}
function addThemeButton(view) {
  const actions = $(".page-head .actions", view);
  if (!actions || $("[data-theme-toggle]", actions)) return;
  const b = document.createElement("button");
  b.type = "button"; b.className = "icon-btn theme-toggle"; b.dataset.themeToggle = "";
  actions.prepend(b);
  setupThemeButtons(actions);
}

// =====================================================================
//  START
// =====================================================================
setupThemeButtons();
$$("[data-nazwa]").forEach((el) => (el.textContent = cfg.NAZWA_GABINETU || "Rejestr wizyt"));
document.title = cfg.NAZWA_GABINETU || "Rejestr wizyt";

$("#fab").onclick = () => {
  const { name, id } = route();
  if (name === "pacjenci") patientModal({});
  else visitModal({ pacjent_id: name === "pacjent" ? id : null, data_wizyty: defaultVisitDate() });
};
window.addEventListener("hashchange", () => { window.scrollTo(0, 0); render(); });
document.addEventListener("click", (e) => { $$("details.multi[open]").forEach((d) => { if (!d.contains(e.target)) d.open = false; }); });

api.onAuth((event, user) => {
  if (event === "PASSWORD_RECOVERY") { if (user) showApp(user); newPasswordModal(); return; }
  if (event === "SIGNED_OUT") { state.user = null; showAuth(); return; }
  if (event === "SIGNED_IN" && user && !state.user) showApp(user);
});

const initialUser = await api.getUser();
if (initialUser) showApp(initialUser); else showAuth();


  </script>
</body>
